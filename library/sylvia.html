<!DOCTYPE html>
<html>
<head>
<title>sylvia- larvae lounge</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font-family: "Comic Sans MS", cursive; color: #4f7d0b; }

.navbar {
text-align: center;
padding: 10px;
position: relative;
z-index: 1;
}

h1 {
text-align: center;
font-size: 4em;
color: #8a2be2;
margin-top: 30px;
position: relative;
z-index: 1;
}

.pdf-link {
text-align: center;
font-size: 1.3em;
position: relative;
z-index: 1;
}

.pdf-link a { color: #8a2be2; }
.pdf-link a:hover { color: #4f7d0b; }

.random-pic {
position: absolute;
z-index: 0;
}
</style>
</head>
<body>

<div class="navbar">
<a href="https://larvaelounge.net">🐛 home</a>
</div>
<hr>

<h1>you found me!</h1>
<p class="pdf-link">
<a href="sylv.html">I Stole This Book From A Library (Pick A Path Poem copy 333)</a><br><br>
</p>

<img class="random-pic" src="godsgay.png" alt="">
<img class="random-pic" src="palindrome.jpg" alt="">
<img class="random-pic" src="typing.jpg" alt="">

<script>
function randomColor() {
  return "#" + Math.floor(Math.random() * 16777215).toString(16).padStart(6, "0");
}

document.body.style.backgroundColor = randomColor();
document.body.style.color = randomColor();
document.querySelector("h1").style.color = randomColor();

var linkColor = randomColor();
document.querySelectorAll("a").forEach(function (a) {
  a.style.color = linkColor;
});

// random size and position for each picture, without overlapping
window.addEventListener("load", function () {
  var placed = [];

  document.querySelectorAll(".random-pic").forEach(function (img) {
    var maxWidth = Math.min(350, window.innerWidth * 0.6);
    var width, height, left, top, spot;

    for (var tries = 0; tries < 200; tries++) {
      width = Math.floor(60 + Math.random() * (maxWidth - 60));
      height = Math.floor(width * img.naturalHeight / img.naturalWidth);
      left = Math.floor(Math.random() * Math.max(0, window.innerWidth - width));
      top = Math.floor(Math.random() * Math.max(0, window.innerHeight - height));
      spot = { left: left, top: top, right: left + width, bottom: top + height };

      var overlaps = placed.some(function (p) {
        return spot.left < p.right && spot.right > p.left &&
               spot.top < p.bottom && spot.bottom > p.top;
      });
      if (!overlaps) break;
    }

    placed.push(spot);
    img.style.width = width + "px";
    img.style.left = left + "px";
    img.style.top = top + "px";
  });
});
</script>

</body>
</html>
