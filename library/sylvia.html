<!DOCTYPE html>
<html>
<head>
<title>sylvia- larvae lounge</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font-family: "Comic Sans MS", cursive; color: #4f7d0b; }

.navbar {
text-align: center;
padding: 10px;
position: relative;
z-index: 1;
}

h1 {
text-align: center;
font-size: 4em;
margin-top: 30px;
position: relative;
z-index: 1;
}

.pdf-link {
text-align: center;
font-size: 1.3em;
position: relative;
z-index: 1;
}

.random-pic {
position: absolute;
z-index: 0;
}
</style>
</head>
<body>

<div class="navbar">
<a href="https://larvaelounge.net">🐛 home</a>
</div>
<hr>

<h1>you found me!</h1>
<p class="pdf-link">
<a href="sylv.html">I Stole This Book From A Library (Pick A Path Poem copy 333)</a>
</p>

<img class="random-pic" src="godsgay.png" alt="">
<img class="random-pic" src="palindrome.jpg" alt="">
<img class="random-pic" src="typing.jpg" alt="">

<script>
var fonts = ["Comic Sans MS", "Courier New", "Georgia", "Impact", "Times New Roman", "Verdana", "Papyrus"];

function randomColor() {
  return "rgb(" + Math.floor(Math.random() * 256) + "," + Math.floor(Math.random() * 256) + "," + Math.floor(Math.random() * 256) + ")";
}

function randomFont() {
  return fonts[Math.floor(Math.random() * fonts.length)];
}

document.body.style.backgroundColor = randomColor();

var h1 = document.getElementsByTagName("h1")[0];
h1.style.color = randomColor();
h1.style.fontFamily = randomFont();

var links = document.getElementsByTagName("a");
for (var i = 0; i < links.length; i++) {
  links[i].style.color = randomColor();
  links[i].style.fontFamily = randomFont();
}

var pics = document.getElementsByClassName("random-pic");
for (var j = 0; j < pics.length; j++) {
  var width = Math.floor(80 + Math.random() * 220);
  pics[j].style.width = width + "px";
  pics[j].style.left = Math.floor(Math.random() * (window.innerWidth - width)) + "px";
  pics[j].style.top = Math.floor(Math.random() * (window.innerHeight - width)) + "px";
}
</script>

</body>
</html>
